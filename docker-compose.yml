services:
  web:
    build:
      context: .
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - NO_PROXY=${NO_PROXY}
    command: python manage.py runserver 0.0.0.0:8000
    restart: always
    volumes:
      - ./api_pingador:/app
      - ./logs:/api_pingador/logs
      - ./.env:/app/.env
    ports:
      - "8002:8000"
    environment:
      - TZ=America/Sao_Paulo
      - HTTP_PROXY=${HTTPS_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY}
    depends_on:
      - pingador_db
    # networks:
    #   - pingador_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  pingador_db:
    image: postgres:13
    restart: always
    volumes:
      - ./.datastorage:/var/lib/postgresql/data
      - ./.env:/app/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: TZ=America/Sao_Paulo
      HTTP_PROXY: ${HTTPS_PROXY}
      HTTPS_PROXY: ${HTTPS_PROXY}
      NO_PROXY: ${NO_PROXY}
    ports:
      - "5432:5432"
    # networks:
    #   - pingador_network

  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - ./.env:/app/.env
    ports:
      - "5672:5672"
      - "15672:15672"
    # networks:
    #   - pingador_network

  celery:
    build:
      context: .
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - NO_PROXY=${NO_PROXY}
    command: celery -A api_pingador worker -l info --concurrency=128 --queues=jornada_digital_queue
    restart: always
    volumes:
      - ./api_pingador:/app
      - ./.env:/app/.env
    environment:
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY}
    depends_on:
      - pingador_db
      - rabbitmq
    # networks:
    #   - pingador_network

  flower:
    build:
      context: .
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - NO_PROXY=${NO_PROXY}
      dockerfile: Dockerfile
    command: celery -A api_pingador flower --basic_auth=${FLOWER_USER}:${FLOWER_PASS} 
    restart: always
    ports:
      - "5555:5555"
    depends_on:
      - rabbitmq
      - celery
    volumes:
      - ./api_pingador:/app
      - ./.env:/app/.env
    environment:
      - FLOWER_PORT=5555
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY}

# networks:
#   pingador_network:
#     driver: bridge
